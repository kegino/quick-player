<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="g-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container arredondado com borda sutil de neon -->
  <rect width="512" height="512" rx="128" fill="url(#g-bg)" />
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="url(#g-play)" stroke-width="6" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="180" fill="#f59e0b" opacity="0.08" filter="url(#glow)"/>

  
        <polygon points="190,140 370,256 190,372" fill="url(#g-play)" filter="url(#glow)"/>
        <polygon points="260,150 205,260 250,260 215,355 295,240 250,240" fill="#ffffff" opacity="0.95"/>
        
</svg>